<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Registration Form | Assignment 4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        body {
            background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 60%, #7c3aed 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .reg-card {
            width: 100%;
            max-width: 480px;
            border: none;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
            overflow: hidden;
        }
        .card-header-custom {
            background: linear-gradient(135deg, #1e3a5f, #2563eb);
            color: #fff;
            padding: 28px 32px;
            text-align: center;
        }
        .card-body { background: #fff; padding: 32px; }
        .form-label { font-weight: 600; color: #475569; font-size: .85rem; text-transform: uppercase; letter-spacing: .5px; }
        .form-control:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
        .form-control.is-invalid { border-color: #dc2626; }
        .invalid-feedback { color: #dc2626; font-size: .82rem; font-weight: 500; }
        .btn-register {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-weight: 700;
            letter-spacing: .5px;
            color: #fff;
        }
        .btn-register:hover { opacity: .9; color: #fff; }
        .assignment-note {
            background: #eff6ff;
            border-left: 3px solid #2563eb;
            border-radius: 0 8px 8px 0;
            padding: 10px 14px;
            font-size: .82rem;
            color: #1e40af;
            margin-bottom: 24px;
        }
        .input-group-text { background: #f8fafc; border-right: none; }
        .form-control { border-left: none; }
    </style>
</head>
<body>
<div class="reg-card card mx-3">
    <div class="card-header-custom">
        <div style="font-size:2rem;margin-bottom:6px;">📋</div>
        <h4 style="font-weight:800;margin:0;">Registration Form</h4>
        <small style="opacity:.8;">Spring MVC Form Validation — Assignment 4</small>
    </div>

    <div class="card-body">
        <!-- Assignment description note -->
        <div class="assignment-note">
            <i class="bi bi-info-circle me-1"></i>
            Fill the form. On submit: server validates fields,
            then <strong>sends a success email</strong> to the provided address.
        </div>

        <!-- Email send error (if any) -->
        <div th:if="${emailError}" class="alert alert-warning rounded-3 mb-3">
            <i class="bi bi-envelope-x me-2"></i>
            <span th:text="${emailError}"></span>
        </div>

        <!--
            th:action, th:object = Thymeleaf binding
            th:field  = binds input to form model field
            th:errors = shows validation error for that field
        -->
        <form th:action="@{/register}" th:object="${form}" method="post" novalidate>

            <!-- Name -->
            <div class="mb-3">
                <label class="form-label">Name</label>
                <div class="input-group"
                     th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
                    <span class="input-group-text"><i class="bi bi-person text-secondary"></i></span>
                    <input type="text"
                           th:field="*{name}"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                           class="form-control"
                           placeholder="Enter your full name"/>
                </div>
                <!-- Validation error message shown HERE by Thymeleaf -->
                <div class="invalid-feedback d-block"
                     th:if="${#fields.hasErrors('name')}"
                     th:errors="*{name}">Name error</div>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label">Email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope text-secondary"></i></span>
                    <input type="email"
                           th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                           class="form-control"
                           placeholder="your@email.com"/>
                </div>
                <div class="invalid-feedback d-block"
                     th:if="${#fields.hasErrors('email')}"
                     th:errors="*{email}">Email error</div>
            </div>

            <!-- Phone -->
            <div class="mb-4">
                <label class="form-label">Phone Number (Phno)</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-telephone text-secondary"></i></span>
                    <input type="tel"
                           th:field="*{phno}"
                           th:classappend="${#fields.hasErrors('phno')} ? 'is-invalid' : ''"
                           class="form-control"
                           placeholder="10-digit mobile number"
                           maxlength="10"/>
                </div>
                <div class="invalid-feedback d-block"
                     th:if="${#fields.hasErrors('phno')}"
                     th:errors="*{phno}">Phone error</div>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn btn-register w-100">
                <i class="bi bi-send me-2"></i>Register & Send Email
            </button>
        </form>

        <div class="text-center mt-3 small text-muted">
            A confirmation email will be sent to the provided email address.
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
